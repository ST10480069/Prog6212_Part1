name: Validate Repository Structure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: /docs folder is missing."
            exit 1
          fi
          echo "docs folder found."

      - name: Check for ERD file (PNG or PDF)
        run: |
          MATCHES=$(find docs -maxdepth 1 \( -iname "*.png" -o -iname "*.pdf" \))
          if [ -z "$MATCHES" ]; then
            echo "ERROR: No ERD file (.png or .pdf) found in /docs."
            exit 1
          fi
          echo "ERD file found: $MATCHES"

      - name: Check for SQL script
        run: |
          MATCHES=$(find docs -maxdepth 1 -iname "*.sql")
          if [ -z "$MATCHES" ]; then
            echo "ERROR: No .sql script found in /docs."
            exit 1
          fi
          echo "SQL script found: $MATCHES"

      - name: Check for API endpoint plan (Markdown or PDF)
        run: |
          MATCHES=$(find docs -maxdepth 1 \( -iname "*.md" -o -iname "*.pdf" \))
          if [ -z "$MATCHES" ]; then
            echo "ERROR: No API endpoint plan (.md or .pdf) found in /docs."
            exit 1
          fi
          echo "API endpoint plan found: $MATCHES"

      - name: All required files present
        run: echo "Repository structure is valid — all required /docs files are present."
