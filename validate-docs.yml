name: Validate Repository Structure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: /docs folder is missing."
            exit 1
          fi
          echo "docs folder found."

      - name: Check for ERD file (PNG or PDF)
        run: |
          if ! ls docs/*.png docs/*.pdf 1> /dev/null 2>&1; then
            echo "ERROR: No ERD file (.png or .pdf) found in /docs."
            exit 1
          fi
          echo "ERD file found."

      - name: Check for SQL script
        run: |
          if ! ls docs/*.sql 1> /dev/null 2>&1; then
            echo "ERROR: No .sql script found in /docs."
            exit 1
          fi
          echo "SQL script found."

      - name: Check for API endpoint plan (Markdown or PDF)
        run: |
          if ! ls docs/*.md docs/*.pdf 1> /dev/null 2>&1; then
            echo "ERROR: No API endpoint plan (.md or .pdf) found in /docs."
            exit 1
          fi
          echo "API endpoint plan found."

      - name: All required files present
        run: echo "Repository structure is valid — all required /docs files are present."
        Add CI workflow to validate docs folder
